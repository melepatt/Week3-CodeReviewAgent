[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "week3-code-review-agent"
version = "0.1.0"
description = "Human-approved multi-agent GitHub pull-request reviewer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Week 3 project author"}]
dependencies = [
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.2,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "python-docx>=1.1,<2",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
code-review-eval = "code_review_agent.evaluation:main"
code-review-app = "code_review_agent.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_review_agent = ["evaluation_catalog.json", "streamlit_config.toml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["code_review_agent"]
omit = ["src/code_review_agent/streamlit_app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
